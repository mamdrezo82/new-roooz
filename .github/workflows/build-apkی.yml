name: Build Optimized Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets (Create www folder)
        run: |
          mkdir -p www
          cp -r * www/ || true
          rm -rf www/www
          rm -rf www/.git
          rm -rf www/.github

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Assets
        run: npx cap sync

      - name: Apply Size Optimizations
        run: |
          # ۱. فعال‌سازی فشرده‌سازی کد و حذف فایل‌های بلااستفاده
          sed -i 's/minifyEnabled false/minifyEnabled true\n            shrinkResources true/' android/app/build.gradle
          # ۲. استفاده از تنظیمات بهینه‌تر برای کوچک‌تر شدن کد
          sed -i 's|proguard-android.txt|proguard-android-optimize.txt|' android/app/build.gradle
          # ۳. حذف معماری‌های قدیمی و نگه‌داشتن فقط معماری ۶۴ بیتی (کاهش شدید حجم)
          sed -i '/defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' android/app/build.gradle

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: RoozYar-Optimized-APK
          path: android/app/build/outputs/apk/release/*.apk
